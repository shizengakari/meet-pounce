[package]
name = "meet-pounce"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "time", "sync", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
tiny_http = "0.12"
url = "2.5"
directories = "5.0"
open = "5.3"

[dependencies.windows]
version = "0.58"
features = [
    "Data_Xml_Dom",
    "UI_Notifications",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
