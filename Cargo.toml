[package]
name = "meet-pounce"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
tokio = { version = "1.40", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dependencies.windows]
version = "0.58"
features = [
    "Data_Xml_Dom",
    "UI_Notifications",
]

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
